baseURL = 'https://artibrains.github.io/'
title = 'Artificial Brains'
theme = 'hugo-theme-relearn'

[security]
  enableInlineShortcodes = true
  [security.exec]
    allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^npx$', '^postcss$', '^pandoc$', '^asciidoctor$']
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']
  [security.http]
    methods = ['(?i)GET|POST']
    urls = ['.*']


[caches]
  [caches.images]
    dir = ':cacheDir/images'


# Configuración multilingüe
defaultContentLanguage = 'es'
defaultContentLanguageInSubdir = false

[languages]
  [languages.es]
    languageName = 'Español'
    weight = 1
    title = 'Cerebros Artificiales'
    contentDir = 'content'

  [languages.en]
    languageName = 'English'
    weight = 2
    title = 'Artificial Brains'
    contentDir = 'content'

[params]

  themeVariant = ['auto','zen-light', 'zen-dark']
    themeVariantAuto = ['zen-light', 'zen-dark']

  # Mostrar selector de idiomas
  showLanguageSwitcher = true
  alwaysopen = true
  disableSearch = true

