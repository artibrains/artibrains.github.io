[faq_title]
other = "Preguntas frecuentes"

[faq_q1]
other = "¿Es un libro técnico denso?"

[faq_a1]
other = "Equilibra narrativa y notas. La intuición llega primero; la matemática y los detalles, justo después y con claridad."

[faq_q2]
other = "¿Necesito saber programar?"

[faq_a2]
other = "No. Se explican los conceptos para comprender cómo y por qué funcionan los modelos. La implementación es un medio, no el fin."

[faq_q3]
other = "¿Es realmente aplicable?"

[faq_a3]
other = "Sí. Aunque la historia es ficticia, las referencias y los datos técnicos son reales y orientados a decisiones del mundo real."

[faq_q4]
other = "¿Bilingüe o dos ediciones?"

[faq_a4]
other = "Dos ediciones separadas: Español o Inglés. El glosario aclara términos clave y sus equivalencias."

[faq_q5]
other = "¿Está orientado solo a medicina?"

[faq_a5]
other = "Los ejemplos son clínicos por su exigencia ética y de validación, pero los principios y técnicas aplican a cualquier sector."

