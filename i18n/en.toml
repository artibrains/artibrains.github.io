[faq_title]
other = "Frequently Asked Questions"

[faq_q1]
other = "Is this a dense technical book?"

[faq_a1]
other = "It balances narrative and notes. Intuition comes first; mathematics and details follow clearly."

[faq_q2]
other = "Do I need to know how to program?"

[faq_a2]
other = "No. The concepts are explained to understand how and why models work. Implementation is a means, not the end."

[faq_q3]
other = "Is it really applicable?"

[faq_a3]
other = "Yes. Although the story is fictional, the references and technical data are real and oriented toward real-world decisions."

[faq_q4]
other = "Bilingual or two editions?"

[faq_a4]
other = "Two separate editions: Spanish or English. The glossary clarifies key terms and their equivalents."

[faq_q5]
other = "Is it only oriented to medicine?"

[faq_a5]
other = "The examples are clinical due to their ethical and validation demands, but the principles and techniques apply to any sector."

