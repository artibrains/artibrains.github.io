<link rel="stylesheet" href="/css/unified-demos.css">

<div class="demo-wrapper derivative-widget-container gradient-widget-container">
  <div class="derivative-widget-header">
    <h3 class="derivative-widget-title">🎮 Interactive Gradient Calculator</h3>
    <p class="derivative-widget-subtitle">Compute the gradient vector ∇f for multivariable functions</p>
  </div>
  
  <div class="derivative-widget-content">
    <div class="derivative-input-group">
      <label for="gw-function" class="derivative-label">f =</label>
      <input id="gw-function" type="text" placeholder="e.g., x^2*y + sin(x*y)" value="x^2 + y^2" class="derivative-input" />
    </div>
    <div class="derivative-input-group" style="margin-top: 0.75rem;">
      <label for="gw-vars" class="derivative-label">Variables:</label>
      <input id="gw-vars" type="text" placeholder="e.g., x, y" value="x, y" class="derivative-input" />
    </div>
    
    <div class="derivative-button-group">
      <button id="gw-compute" class="demo-btn demo-btn-primary">✨ Compute ∇f</button>
      <button id="gw-walpha" class="demo-btn demo-btn-secondary">🔗 Open in WolframAlpha</button>
    </div>
    
    <div id="gw-result" class="derivative-result"></div>
    <div id="gw-error" class="derivative-error"></div>
    <small class="derivative-hint">Symbolic gradient via math.js. For step-by-step derivations, use WolframAlpha.</small>
  </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.1/lib/browser/math.min.js"></script>
<script>
  (function(){
    const $ = (id) => document.getElementById(id);
    const finput = $("gw-function");
    const vinput = $("gw-vars");
    const btnCompute = $("gw-compute");
    const btnWA = $("gw-walpha");
    const out = $("gw-result");
    const err = $("gw-error");

    function renderLatex(latex) {
      out.innerHTML = '';
      const block = document.createElement('div');
      block.style.padding = '0.5rem 0';
      out.appendChild(block);
      try {
        if (window.katex) {
          katex.render(latex, block, { throwOnError: false, displayMode: true });
        } else {
          block.textContent = latex;
        }
      } catch(e) {
        block.textContent = latex;
      }
    }

    function toMMA(expr) {
      // Convert common functions to Wolfram Language syntax (opening bracket only)
      // WolframAlpha is tolerant of parentheses for arguments, so we avoid global ') -> ]'
      return expr
        .replace(/\bln\s*\(/gi, 'Log[')
        .replace(/\blog\s*\(/gi, 'Log[')
        .replace(/\bsin\s*\(/gi, 'Sin[')
        .replace(/\bcos\s*\(/gi, 'Cos[')
        .replace(/\btan\s*\(/gi, 'Tan[')
        .replace(/\bcot\s*\(/gi, 'Cot[')
        .replace(/\bsec\s*\(/gi, 'Sec[')
        .replace(/\bcsc\s*\(/gi, 'Csc[')
        .replace(/\bexp\s*\(/gi, 'Exp[')
        .replace(/\bsqrt\s*\(/gi, 'Sqrt[');
    }

    btnCompute.addEventListener('click', () => {
      err.textContent = '';
      out.innerHTML = '';
      const expr = (finput.value || '').trim();
      const vars = (vinput.value || '').split(',').map(s => s.trim()).filter(Boolean);
      if (!expr) { err.textContent = 'Enter a function (e.g., x^2*y + sin(x*y)).'; return; }
      if (!vars.length) { err.textContent = 'Specify at least one variable (e.g., x, y).'; return; }
      try {
        const fnode = math.parse(expr);
        const parts = [];
        for (const v of vars) {
          const d = math.derivative(fnode, v);
          const ds = math.simplify(d);
          parts.push(ds.toTex({parenthesis:'auto'}));
        }
        const fLatex = `f(${vars.join(',')}) = \\; ${fnode.toTex({parenthesis:'auto'})}`;
        const grad = parts.join(' \\, , \\, ');
        const gradLatex = `\\nabla f = \\begin{bmatrix} ${grad} \\end{bmatrix}`;
        renderLatex(`${fLatex}\\\\ ${gradLatex}`);
      } catch(e) {
        err.textContent = 'Could not parse or differentiate. Try simpler syntax and variable names.';
      }
    });

    btnWA.addEventListener('click', () => {
      const rawExpr = (finput.value || '').trim() || 'x^2*y + sin(x*y)';
      const mmaExpr = toMMA(rawExpr);
      const rawVars = (vinput.value || '').trim() || 'x, y';
      const varList = rawVars.split(',').map(s => s.trim()).filter(Boolean).join(', ');
      // Mathematica-style query using Grad
      const q = `Grad[${mmaExpr}, {${varList}}]`;
      const url = `https://www.wolframalpha.com/input?i=${encodeURIComponent(q)}`;
      window.open(url, '_blank', 'noopener');
    });
  })();
</script>

<style>
/* Gradient widget variation with slightly different color */
.gradient-widget-container {
  border-color: color-mix(in srgb, var(--demo-accent-alt) 30%, var(--demo-border));
}

.gradient-widget-container .derivative-widget-header {
  background: linear-gradient(135deg,
    color-mix(in srgb, var(--demo-accent-alt) 10%, var(--demo-surface)) 0%,
    var(--demo-surface) 100%);
}

.gradient-widget-container .derivative-widget-title {
  color: var(--demo-accent-alt);
}

.gradient-widget-container .derivative-input:focus {
  border-color: var(--demo-accent-alt);
}

.gradient-widget-container .derivative-result {
  border-color: color-mix(in srgb, var(--demo-accent-alt) 30%, var(--demo-border));
}
</style>
