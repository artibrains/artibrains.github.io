<link rel="stylesheet" href="/css/unified-demos.css">

<div class="demo-wrapper derivative-widget-container">
  <div class="derivative-widget-header">
    <h3 class="derivative-widget-title">🎮 Interactive Derivative Calculator</h3>
    <p class="derivative-widget-subtitle">Enter any function of x to compute its derivative symbolically</p>
  </div>
  
  <div class="derivative-widget-content">
    <div class="derivative-input-group">
      <label for="dw-function" class="derivative-label">f(x) =</label>
      <input id="dw-function" type="text" placeholder="e.g., sin(x)^2 * ln(x)" value="sin(x)^2" class="derivative-input" />
    </div>
    
    <div class="derivative-button-group">
      <button id="dw-compute" class="demo-btn demo-btn-primary">✨ Compute f′(x)</button>
      <button id="dw-walpha" class="demo-btn demo-btn-secondary">🔗 Open in WolframAlpha</button>
    </div>
    
    <div id="dw-result" class="derivative-result"></div>
    <div id="dw-error" class="derivative-error"></div>
    <small class="derivative-hint">This widget uses math.js for symbolic differentiation. For step-by-step explanations, use the WolframAlpha button.</small>
  </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.1/lib/browser/math.min.js"></script>
<script>
  (function(){
    const $ = (id) => document.getElementById(id);
    const input = $("dw-function");
    const btnCompute = $("dw-compute");
    const btnWA = $("dw-walpha");
    const out = $("dw-result");
    const err = $("dw-error");

    function renderLatex(latex) {
      out.innerHTML = '';
      const block = document.createElement('div');
      block.style.padding = '0.5rem 0';
      out.appendChild(block);
      try {
        if (window.katex) {
          katex.render(latex, block, { throwOnError: false, displayMode: true });
        } else {
          block.textContent = latex;
        }
      } catch(e) {
        block.textContent = latex;
      }
    }

    btnCompute.addEventListener('click', () => {
      err.textContent = '';
      out.innerHTML = '';
      const expr = input.value && input.value.trim();
      if (!expr) {
        err.textContent = 'Please enter a function of x (e.g., sin(x)*x^2).';
        return;
      }
      try {
        const x = math.parse('x');
        const node = math.parse(expr);
        const dnode = math.derivative(node, x);
        // Attempt a simplified form
        const simplified = math.simplify(dnode);
        const fLatex = `f(x) = \\; ${node.toTex({parenthesis:'auto'})}`;
        const dLatex = `f'(x) = \\; ${simplified.toTex({parenthesis:'auto'})}`;
        renderLatex(`${fLatex}\\\\ ${dLatex}`);
      } catch(e) {
        err.textContent = 'Could not parse or differentiate the expression. Try simpler syntax.';
      }
    });

    btnWA.addEventListener('click', () => {
      const expr = input.value && input.value.trim();
      const q = expr ? `derivative of ${expr}` : 'derivative of x^2';
      const url = `https://www.wolframalpha.com/input?i=${encodeURIComponent(q)}`;
      window.open(url, '_blank', 'noopener');
    });
  })();
</script>
